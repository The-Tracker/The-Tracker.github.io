short_bio: >-
  <p>
    I am an undergraduate student majoring in Big Data Management and Application
    at the School of Business and Management, Jilin University, China.
    My research interests lie at the intersection of information resource management,
    artificial intelligence, and knowledge discovery.
  </p>
  <p>
    My current research activities include extracting research questions and research
    methods from scientific publications, bibliometric analysis of research trends,
    and exploring the integration of digital and intelligent technologies
    with information resource management.
  </p>
  <p><strong>Research Interests</strong><br>
    Information Resource Management; AI for Scientific Research;
    Scientometrics and Knowledge Discovery; Intelligent Libraries.
  </p>
  <p><strong>Selected Research Activities</strong></p>
  <ul>
    <li><strong>Research question and method extraction:</strong> investigating
    structured extraction of research questions, methods, and their relationships
    from scientific abstracts.</li>
    <li><strong>Bibliometric analysis:</strong> analyzing thematic patterns
    and research trends in library and information science.</li>
    <li><strong>Digital-intelligent information resource management:</strong>
    exploring the intersection of traditional Chinese culture,
    intelligent technologies, and discipline-specific knowledge systems.</li>
  </ul>
  <p>Publication records and academic identifiers will be added after verification.</p>

